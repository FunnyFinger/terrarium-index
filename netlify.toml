[build]
  # No build command needed - this is a static site
  publish = "."
  functions = "netlify/functions"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Report-Only: browsers log violations but do NOT block anything (safe to deploy).
    # Tighten and switch to Content-Security-Policy after reviewing reports.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://d3js.org https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://vivarium-store.com https://vivarium-store.netlify.app; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://challenges.cloudflare.com; worker-src 'self'; base-uri 'self'; object-src 'none'"

# Public browser config from Netlify env (SUPABASE_URL, SUPABASE_ANON_KEY, …)
# force=true so this wins over the static js/config.js placeholders in the repo.
[[redirects]]
  from = "/js/config.js"
  to = "/.netlify/functions/public-config"
  status = 200
  force = true

# Prefer clean home URL (avoid /index.html duplicate)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Dynamic SEO (catalog-driven — new plants/supplies/vivariums appear automatically)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/plants/:slug"
  to = "/.netlify/functions/product-page?type=plant&slug=:slug"
  status = 200

[[redirects]]
  from = "/supplies/:slug"
  to = "/.netlify/functions/product-page?type=supply&slug=:slug"
  status = 200

[[redirects]]
  from = "/vivariums/:slug"
  to = "/.netlify/functions/product-page?type=vivarium&slug=:slug"
  status = 200

# Custom 404 — only used when no matching file/function exists (does not override real pages)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Service worker must never be cached — browser checks for SW updates on every page load
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# JS files use ?v= query strings for cache busting — do NOT use immutable.
# immutable would tell the browser "this URL will never change" which conflicts
# with query-string versioning. 1-day max-age is a safe middle ground.
[[headers]]
  for = "/**/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=86400"

# JSON data files — 1 hour, refreshed often
[[headers]]
  for = "/data/**/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Images are truly immutable (same path = same image), so immutable is correct here
[[headers]]
  for = "/images/**/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG icons
[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"
